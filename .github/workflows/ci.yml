name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  demo-assessment:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The hardened demo bot must pass the high-severity gate.
      - run: llm-assure run -t examples/targets/demo_hardened.yaml -o llm-assure-report --fail-on high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-assurance-report
          path: llm-assure-report
