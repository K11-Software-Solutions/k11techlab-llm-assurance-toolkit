[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k11-llm-assure"
version = "0.1.0"
description = "LLM red-teaming and assurance toolkit: attack suites, CI quality gates, audit-ready reports and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "K11 Software Solutions" }]
keywords = ["llm", "red-teaming", "ai-safety", "evaluation", "mcp", "qa", "owasp-llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
judge = ["anthropic>=0.100"]
mcp = ["mcp>=1.20,<2"]
all = ["anthropic>=0.100", "mcp>=1.20,<2"]
dev = ["pytest>=8", "anthropic>=0.100", "mcp>=1.20,<2"]

[project.scripts]
llm-assure = "llm_assure.cli:main"
llm-assure-mcp = "llm_assure.mcp_server:main"

[project.urls]
Homepage = "https://k11softwaresolutions.com"
Repository = "https://github.com/K11-Software-Solutions/k11techlab-llm-assurance-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_assure = ["suites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
